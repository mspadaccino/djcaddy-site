# La pagina di download su GitHub Pages: la radice del repo, così com'è, a
# ogni push su main. Niente build: è HTML statico.
#
# Pages va acceso UNA volta a mano: Settings ▸ Pages ▸ Build and
# deployment ▸ Source: «GitHub Actions». Da lì la pagina esce su
# https://mspadaccino.github.io/djcaddy-site/ e, con un dominio proprio,
# sul dominio messo nella stessa schermata.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
